[package]
name = "rust_quran_engine"
version = "0.1.0"
edition = "2021"

[lints.clippy]
# pedantic = "warn"
# nursery = "warn"
unwrap_used = "deny"
panic = "deny"

[dependencies]
colored = { version = "3.0.0", optional = true }
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1.0.140", optional = true }


[features]
default = ["king_fahad_mushaf", "colored_output"]
king_fahad_mushaf = ["serde_json", "serde", "colored_output"]
colored_output = ["colored"]
