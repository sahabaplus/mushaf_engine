[package]
name = "mushaf_engine"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Line-based Quran Mushaf navigation engine (King Fahad edition)"
repository = "https://github.com/sahabaplus/mushaf_engine"
readme = "README.md"
keywords = ["quran", "mushaf", "navigation", "islam"]
categories = ["text-processing"]
exclude = [".claude/", ".vscode/", "t.txt"]

[dependencies]
colored = { version = "3.0.0", optional = true }
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1.0.140", optional = true }

[features]
default = ["king_fahad_mushaf"]
king_fahad_mushaf = ["serde_json", "serde"]
colored_output = ["colored"]

[dev-dependencies]
colored = "3.0.0"
once_cell = "1.21.4"
